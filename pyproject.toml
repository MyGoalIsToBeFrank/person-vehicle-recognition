[project]
name = "person-vehicle-recognition"
version = "2.0.0"
description = "Bounded asynchronous FastAPI edge for the native CUDA/TensorRT worker"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "opencv-python-headless==4.12.0.88",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
