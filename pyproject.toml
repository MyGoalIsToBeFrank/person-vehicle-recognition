[project]
name = "independent-structured-inference"
version = "0.1.0"
description = "Independent person and vehicle structured inference"
requires-python = ">=3.10,<3.11"
dependencies = [
  "paddlepaddle-gpu==3.3.0",
  "nvidia-cuda-runtime==13.0.88",
  "nvidia-cudnn-cu13==9.13.0.50",
  "nvidia-cublas==13.0.2.14",
  "nvidia-cufft==12.0.0.61",
  "nvidia-curand==10.4.0.35",
  "nvidia-cusolver==12.0.4.66",
  "nvidia-cusparse==12.6.3.3",
  "numpy<2",
  "opencv-python<=4.6.0.66",
  "onnxruntime>=1.23,<2",
  "hyperlpr3==0.1.3",
  # Paddle 3.3.0 imports setuptools but does not declare it itself.
  "setuptools",
]

[tool.uv]
package = false

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu130" }
nvidia-cuda-runtime = { index = "paddle-cu130" }
nvidia-cudnn-cu13 = { index = "paddle-cu130" }
nvidia-cublas = { index = "paddle-cu130" }
nvidia-cufft = { index = "paddle-cu130" }
nvidia-curand = { index = "paddle-cu130" }
nvidia-cusolver = { index = "paddle-cu130" }
nvidia-cusparse = { index = "paddle-cu130" }

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true
