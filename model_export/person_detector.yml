# Inference-only reconstruction of the existing fine-tuned PP-YOLOE-S.
# No optimizer, reader, or training command consumes this file.
_BASE_:
  - ../vendor/PaddleDetection/configs/ppyoloe/ppyoloe_crn_s_300e_coco.yml
num_classes: 1
weights: models/finetuned/person_detector_checkpoints/model_final
export_with_pir: true
export:
  post_process: true
  nms: false
PPYOLOEHead:
  exclude_nms: true
TestReader:
  inputs_def:
    image_shape: [null, 3, 640, 640]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: false, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: true}
    - Permute: {}
